[workspace]
resolver = "3"
members = ["crates/core", "crates/text", "crates/audio", "crates/media", "crates/render", "crates/mcp", "crates/app"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
ed-core = { path = "crates/core" }
ed-render = { path = "crates/render" }
ed-text = { path = "crates/text" }
ed-audio = { path = "crates/audio" }
ed-media = { path = "crates/media" }
ed-mcp = { path = "crates/mcp" }
anyhow = "1"
glam = "0.34"
bytemuck = { version = "1", features = ["derive"] }
indexmap = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync"] }
wgpu = "30"
naga = { version = "30", features = ["wgsl-in"] }
eframe = { version = "0.36", default-features = false, features = ["wgpu", "default_fonts", "accesskit"] }
egui_dock = "0.21"
rmcp = { version = "3.5", features = ["server", "transport-streamable-http-server"] }
axum = "0.8"
png = "0.18"
base64 = "0.23"
portable-pty = "0.9"
vt100 = "0.16"
schemars = "1"
fontdb = "0.24"
lyon_tessellation = "1"
rustybuzz = "0.20"
aubio = { version = "0.2", features = ["builtin", "accelerate", "bindgen"] }
cpal = "0.18"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp", "gif", "bmp", "tiff", "hdr"] }
rfd = "0.17"
ureq = { version = "3", features = ["json"] }
rhai = "1"
gltf = { version = "1.4", default-features = false, features = ["import", "utils"] }

# Our crates build at opt-level 1 so `cargo run` is usable for real films
# (measured: a chess export runs 2.7x faster; an ed-core rebuild takes ~16s
# instead of ~7s). Dependencies (wgpu, egui, naga...) are optimized once and cached.
[profile.dev]
opt-level = 1
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
debug = false
